name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0). Defaults to the tag name on tag pushes."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build, package and publish
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Run tests
        run: |
          swift test --package-path Core
          swift test --package-path Engine
          swift test --package-path App

      - name: Package app zip
        run: scripts/package-release.sh
        env:
          SIGNING_IDENTITY: ${{ secrets.SIGNING_IDENTITY }}
          VERSION: ${{ github.event.inputs.version || github.ref_name }}

      - name: Verify app bundle is self-contained (no missing frameworks)
        run: scripts/verify-bundle.sh build/SpellCheck.app

      - name: Notarize (optional, needs Apple Developer notarization keys)
        if: env.NOTARY_API_KEY != ''
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          echo "$NOTARY_API_KEY" | base64 -d > /tmp/notary-key.p8
          xcrun notarytool store-credentials spellcheck-notary \
            --key /tmp/notary-key.p8 --key-id "$NOTARY_API_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
          xcrun notarytool submit build/SpellCheck-macOS.zip --keychain-profile spellcheck-notary --wait
          xcrun stapler staple build/SpellCheck.app
          rm -f build/SpellCheck-macOS.zip
          ditto -c -k --keepParent build/SpellCheck.app build/SpellCheck-macOS.zip

      - name: Sign update with Sparkle key (optional)
        if: env.SPARKLE_PRIVATE_KEY != ''
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" > /tmp/sparkle_private_key.pem
          curl -sL https://github.com/sparkle-project/Sparkle/releases/download/2.10.1/Sparkle-2.10.1.tar.xz -o /tmp/sparkle.tar.xz
          mkdir -p /tmp/sparkle-tools && tar -xf /tmp/sparkle.tar.xz -C /tmp/sparkle-tools
          # (note: /tmp is a symlink on macOS runners — find into a real dir)
          SIGN_TOOL=$(find /tmp/sparkle-tools -type f -name sign_update -not -path "*/old_dsa_scripts/*" | head -1)
          if [ -z "$SIGN_TOOL" ]; then
            echo "sign_update tool not found after extracting Sparkle" >&2
            find /tmp/sparkle-tools -maxdepth 3 | head -20 >&2
            exit 1
          fi
          chmod +x "$SIGN_TOOL"
          # sign_update prints XML attributes like:
          #   sparkle:edSignature="base64..." length="123"
          # Extract ONLY the edSignature value — embedding the whole output
          # as the signature produces an invalid appcast.
          SIG=$("$SIGN_TOOL" build/SpellCheck-macOS.zip --private-key /tmp/sparkle_private_key.pem | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          if [ -z "$SIG" ]; then
            echo "Failed to extract Sparkle edSignature" >&2
            exit 1
          fi
          echo "SPARKLE_SIGNATURE=$SIG" >> "$GITHUB_ENV"

      - name: Generate appcast.xml
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          scripts/make-appcast.sh "$RELEASE_VERSION" build/SpellCheck-macOS.zip "${{ env.SPARKLE_SIGNATURE }}"
          # The appcast must carry a valid Sparkle signature when a key is
          # configured, and never a mangled one.
          if [ -n "${{ env.SPARKLE_SIGNATURE }}" ]; then
            grep -q 'sparkle:edSignature="[^"]*" length=' appcast.xml || {
              echo "appcast.xml has no valid sparkle:edSignature enclosure" >&2; exit 1; }
          fi
          xmllint --noout appcast.xml

      - name: Commit appcast.xml to main
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml
          git commit -m "Update appcast for $RELEASE_VERSION" || echo "no appcast changes"
          git push origin HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/SpellCheck-macOS.zip
            appcast.xml
          generate_release_notes: true
