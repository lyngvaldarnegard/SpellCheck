name: Release

on:
  push:
    branches:
      # A release can also be cut by pushing a branch named exactly like
      # the version (e.g. refs/heads/v1.2.0) - the path used by automation
      # that can create branches but not tags.
      - "v*.*.*"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v0.2.0). Defaults to the tag name on tag pushes."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build, package and publish
    # Retry trigger 18.11.2026, 04:59 UTC (comment-only commit to fire the workflow)
    runs-on: macos-15