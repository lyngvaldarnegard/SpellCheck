name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    name: Core tests
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Test Core
        run: swift test --package-path Core

  engine-tests:
    name: Engine tests
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Test Engine
        run: swift test --package-path Engine

  app-build:
    name: App build (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - name: Build app
        run: swift build --package-path App -c release
      - name: Test app
        run: swift test --package-path App
      - name: Package and verify app bundle is self-contained
        run: |
          scripts/package-release.sh
          scripts/verify-bundle.sh build/SpellCheck.app

      - name: Verify the SHIPPED zip (extract + signature checks + launch smoke test)
        run: |
          rm -rf /tmp/shipped && mkdir -p /tmp/shipped
          ditto -x -k build/SpellCheck-macOS.zip /tmp/shipped
          scripts/verify-bundle.sh /tmp/shipped/SpellCheck.app
          EXE="/tmp/shipped/SpellCheck.app/Contents/MacOS/SpellCheck"
          "$EXE" > /tmp/shipped-launch.log 2>&1 &
          APP_PID=$!
          sleep 8
          if kill -0 "$APP_PID" 2>/dev/null; then
            echo "Launch smoke test OK: app survived 8s (all frameworks loaded, no dyld abort)"
            kill "$APP_PID" 2>/dev/null || true
          else
            echo "LAUNCH SMOKE TEST FAILED - app exited during startup:" >&2
            cat /tmp/shipped-launch.log >&2
            exit 1
          fi
